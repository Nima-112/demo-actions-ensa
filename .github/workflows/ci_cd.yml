name: Pipeline CI et CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest
        run: pip install pytest

      - name: Lancer les tests
        run: pytest

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Simuler le déploiement
        run: echo "Déploiement réussi, la nouvelle version est en ligne"